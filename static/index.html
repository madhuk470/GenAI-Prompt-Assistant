<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GenAI Prompt Assistant</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        textarea,
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 8px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #response {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ccc;
            min-height: 120px;
            white-space: pre-wrap;
        }

    </style>

</head>


<body>

    <h1>GenAI Prompt Assistant</h1>


    <label for="systemInstruction">
        System Instruction
    </label>

    <textarea id="systemInstruction">You are a helpful GenAI tutor. Explain concepts clearly and give simple examples.</textarea>


    <label for="prompt">
        User Prompt
    </label>

    <textarea
        id="prompt"
        placeholder="Enter your prompt here..."></textarea>


    <label for="temperature">
        Temperature
    </label>

    <input
        type="number"
        id="temperature"
        value="0.7"
        min="0"
        max="2"
        step="0.1">


    <label for="maxOutputTokens">
        Max Output Tokens
    </label>

    <input
        type="number"
        id="maxOutputTokens"
        value="300"
        min="1"
        step="1">


    <button onclick="sendPrompt()">
        Generate Response
    </button>


    <div id="response">
        Gemini response will appear here...
    </div>


    <script>

        async function sendPrompt() {

            const prompt =
                document.getElementById("prompt").value;

            const systemInstruction =
                document.getElementById("systemInstruction").value;

            const temperature =
                parseFloat(
                    document.getElementById("temperature").value
                );

            const maxOutputTokens =
                parseInt(
                    document.getElementById("maxOutputTokens").value
                );

            const responseBox =
                document.getElementById("response");


            if (!prompt.trim()) {

                responseBox.innerText =
                    "Please enter a prompt.";

                return;
            }


            responseBox.innerText =
                "Generating response...";


            try {

                const response = await fetch(
                    "/generate",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            prompt: prompt,

                            system_instruction:
                                systemInstruction,

                            temperature:
                                temperature,

                            max_output_tokens:
                                maxOutputTokens
                        })
                    }
                );


                const data =
                    await response.json();


                responseBox.innerText =
                    data.response;


            } catch (error) {

                responseBox.innerText =
                    "Error connecting to backend: "
                    + error;

            }

        }

    </script>

</body>

</html>
