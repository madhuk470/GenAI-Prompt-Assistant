<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My GenAI App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #response {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ccc;
            min-height: 100px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>My GenAI Application</h1>

    <textarea
        id="prompt"
        placeholder="Enter your prompt here...">
    </textarea>

    <br>

    <button onclick="sendPrompt()">
        Generate
    </button>

    <div id="response">
        Gemini response will appear here...
    </div>


    <script>

        async function sendPrompt() {

            const prompt = document.getElementById("prompt").value;

            const responseBox = document.getElementById("response");

            if (!prompt.trim()) {
                responseBox.innerText = "Please enter a prompt.";
                return;
            }

            responseBox.innerText = "Generating response...";


            try {

                const response = await fetch("/generate", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        prompt: prompt
                    })

                });


                const data = await response.json();

                responseBox.innerText = data.response;


            } catch (error) {

                responseBox.innerText =
                    "Error connecting to backend: " + error;

            }

        }

    </script>

</body>

</html>
